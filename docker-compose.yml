# StockPilot production stack (VPS). Đặt file này ở thư mục cha chứa backend/ và frontend/
# (deploy.sh tự chép bản mới nhất ra đó mỗi lần deploy):
#
#   /var/www/stockpilot/
#   ├── backend/            (repo StockPilot_BE, có backend/.env)
#   ├── frontend/           (repo StockPilot_FE)
#   └── docker-compose.yml  (bản sao của file này)
#
# Mọi khóa bí mật nằm trong backend/.env (không commit). Mẫu: backend/production.env.example.
# Chạy: docker compose --env-file backend/.env up -d --build
#
# Các cổng chỉ mở trên 127.0.0.1: chỉ Nginx của máy chủ (đứng sau Cloudflare) gọi được vào,
# không ai truy cập thẳng MySQL / API / frontend qua IP của VPS.

services:
  mysql:
    image: mysql:8.0
    container_name: stockpilot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong backend/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stockpilot}
      MYSQL_USER: ${MYSQL_USER:-stockpilot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong backend/.env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ để Compose không thay biến: mật khẩu được đọc bên trong container.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockpilot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockpilot-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Mật khẩu chỉ dùng chữ và số (xem production.env.example) để không phải mã hóa URL.
      DATABASE_URL: mysql://${MYSQL_USER:-stockpilot_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-stockpilot}
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-stockpilot.name.vn}
      # Số proxy đứng trước backend: Cloudflare → Nginx máy chủ → Nginx container frontend.
      TRUST_PROXY: ${TRUST_PROXY:-3}
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - stockpilot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: stockpilot-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - stockpilot-net

volumes:
  mysql_data:

networks:
  stockpilot-net:
    driver: bridge
