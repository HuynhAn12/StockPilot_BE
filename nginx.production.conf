# ==============================================================================
# StockPilot Production Nginx Configuration
# Multi-Tenant Wildcard Subdomain: *.stockpilot.name.vn & stockpilot.name.vn
# ==============================================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name stockpilot.name.vn *.stockpilot.name.vn;

    # Hỗ trợ xác thực Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS chính (Port 443) xử lý toàn bộ Subdomain và Root domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stockpilot.name.vn *.stockpilot.name.vn;

    # Đường dẫn SSL Wildcard (*.stockpilot.name.vn + stockpilot.name.vn)
    ssl_certificate /etc/letsencrypt/live/stockpilot.name.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockpilot.name.vn/privkey.pem;

    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Thư mục chứa mã nguồn Frontend đã build (dist)
    root /var/www/stockpilot/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # API Backend: Chuyển tiếp toàn bộ request /api/v1 sang Node.js Backend (Port 5000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # CỰC KỲ QUAN TRỌNG: Giữ nguyên Host để backend middleware nhận diện Subdomain từng shop!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Hỗ trợ Server-Sent Events (SSE) cho máy quét mã vạch (Barcode Scanner) & AI Assistant
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Tối ưu tốc độ tải trang cho Frontend Vite)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Fallback: Hỗ trợ React Router (HTML5 History Mode)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
