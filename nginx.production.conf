# Nginx của MÁY CHỦ (VPS) cho stockpilot.name.vn và mọi subdomain cửa hàng.
# Đường đi: Cloudflare (mây cam, SSL Full strict) → Nginx này (443) → container frontend 127.0.0.1:3000
#           → (/api/) container backend.
#
# Cài đặt:
#   sudo cp nginx.production.conf /etc/nginx/sites-available/stockpilot
#   sudo ln -sf /etc/nginx/sites-available/stockpilot /etc/nginx/sites-enabled/stockpilot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Chứng chỉ: Cloudflare → SSL/TLS → Origin Server → Create Certificate cho
# "stockpilot.name.vn" và "*.stockpilot.name.vn", lưu vào 2 file bên dưới (key: chmod 600).

server {
    listen 80;
    listen [::]:80;
    server_name stockpilot.name.vn *.stockpilot.name.vn;

    return 301 https://$host$request_uri;
}

server {
    # Cú pháp "listen ... http2" chạy được trên Nginx 1.18–1.24 của Ubuntu (Nginx ≥ 1.25 chỉ cảnh báo).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stockpilot.name.vn *.stockpilot.name.vn;

    ssl_certificate     /etc/ssl/cloudflare/stockpilot.pem;
    ssl_certificate_key /etc/ssl/cloudflare/stockpilot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ảnh sản phẩm, file import Excel.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Giữ nguyên subdomain: backend nhận diện cửa hàng theo Host.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Kết nối thời gian thực (SSE quét mã vạch, thông báo) không được giữ đệm.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
